# Development compose file — mirrors the spike's docker-compose.yml pattern.
#
# Usage (from the repo root):
#   docker compose -f dev-compose.yml run --rm dev make build
#   docker compose -f dev-compose.yml run --rm dev make test
#   docker compose -f dev-compose.yml run --rm dev make build-all
#   docker compose -f dev-compose.yml run --rm dev go test ./...
#   docker compose -f dev-compose.yml run --rm dev sh   # interactive shell
#
# The repo is mounted read-write at /workspace so build artefacts (target/),
# the Go build cache (.cache/go-build) and the module cache (.cache/pkg/mod)
# persist across runs inside the repo tree, owned by the calling user.
#
# UID/GID are taken from the host shell at runtime (fall back to 501:20).
# Re-build the image when the Dockerfile changes:
#   UID=$(id -u) GID=$(id -g) docker compose -f dev-compose.yml build

services:
  dev:
    build:
      context: .devcontainer/ibmdocs-dev01
      dockerfile: Dockerfile
      args:
        __uid: "${UID:-501}"
        __gid: "${GID:-20}"
    image: ibmdocs-dev:local
    user: "${UID:-501}:${GID:-20}"
    working_dir: /workspaces/7u-ibm-doc-fetcher-cli
    volumes:
      - .:/workspaces/7u-ibm-doc-fetcher-cli   # repo root — source + build output
    environment:
      - CGO_ENABLED=0
      - GOPATH=/workspaces/7u-ibm-doc-fetcher-cli/.cache/gopath
      - GOCACHE=/workspaces/7u-ibm-doc-fetcher-cli/.cache/go-build
      - GOMODCACHE=/workspaces/7u-ibm-doc-fetcher-cli/.cache/pkg/mod
    stdin_open: true
    tty: true
